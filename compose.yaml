name: Nexonix-Application

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    networks:
      - nexonix-net
    volumes:
      - mongo_data:/data/db
  
  mongo-express:
    image: mongo-express:1.0
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: webadmin
      ME_CONFIG_BASICAUTH_PASSWORD: WebPassword123!
    networks:
      - nexonix-net
    depends_on:
      - mongodb
    
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    restart: unless-start
    env_file: ./backend/.env
    environment: 
      NODE_ENV: development
      PORT: 5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - nexonix-net
    depends_on:
      - mongodb
      - mongo-express
    
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    env_file: ./frontend/.env
    environment:
      NODE_ENV: development
      PORT: 5173
    networks:
      - nexonix-net
    depends_on:
      - api

networks:
  nexonix-net:
    driver: bridge

volumes:
  mongo_data: