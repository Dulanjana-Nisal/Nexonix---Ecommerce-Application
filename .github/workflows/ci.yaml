name: Nexonix Application CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }} - ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Test

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    timeout-minutes: 10
    
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Setup node environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
        
      - name: Install dependency
        run: npm ci

      - name: Run Tests
        run: npm test
    
  frontend-test:
    name: Frontend Test

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend
    
    timeout-minutes: 10
    
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Setup node environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependency
        run: npm ci

      - name: Run tests
        run: npm test
      
      - name: Build Application
        run: npm run build
    
  quality-gate:
    name: Quality Gate

    runs-on: ubuntu-latest

    needs: [backend-test, frontend-test]

    steps:
      - name: Run final job
        run: echo 'All application validations passed.'