name: Nexonix Application CI

on:
  push:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Test

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Setup node environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
        
      - name: Install dependency
        run: npm ci

      - name: Run Tests
        run: npm test
    
  frontend-test:
    name: Frontend Test

    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Setup node environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependency
        run: npm ci

      - name: Run tests
        run: npm test
      
      - name: Build Application
        run: npm run build
    